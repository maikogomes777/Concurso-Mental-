<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONCURSO://ZERO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E0C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E0C; --panel:#14181A; --panel2:#1D2422; --line:#2A322E;
    --gold:#D9A93B; --green:#35D07F; --red:#E5484D; --blue:#5FB4E5; --text:#EDEDE5; --dim:#8B948C;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Mono', monospace; -webkit-font-smoothing:antialiased; min-height:100vh;}
  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.03em;}
  #app{max-width:520px; margin:0 auto; padding:16px 16px 60px; min-height:100vh;}

  #updateBanner{display:none; background:var(--gold); color:#1a1400; padding:10px 14px; border-radius:4px; font-size:12.5px; margin-bottom:10px; align-items:center; justify-content:space-between; gap:10px;}
  #updateBanner button{background:#1a1400; color:var(--gold); border:none; padding:7px 12px; border-radius:3px; font-family:'Bebas Neue'; font-size:12px; cursor:pointer; white-space:nowrap;}

  #gate{position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;}
  .gate-card{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:28px 24px;}
  .gate-card h1{font-family:'Bebas Neue'; font-size:32px; letter-spacing:0.04em; color:var(--gold); margin:0 0 4px;}
  .gate-card p.sub{color:var(--dim); font-size:12.5px; margin:0 0 22px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
  .field input{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:11px 12px; border-radius:3px; font-family:inherit; font-size:14px;}
  .field input:focus{outline:none; border-color:var(--gold);}
  .btn{width:100%; padding:12px; border-radius:3px; border:none; font-family:'Bebas Neue'; font-size:16px; letter-spacing:0.05em; cursor:pointer; margin-top:6px;}
  .btn-primary{background:var(--gold); color:#1a1400;}
  .btn-ghost{background:transparent; color:var(--dim); border:1px solid var(--line);}
  .btn-danger{background:var(--red); color:#fff;}
  .btn-sm{width:auto; padding:7px 12px; font-size:11px; margin-right:6px; margin-top:0;}
  .gate-msg{font-size:11.5px; color:var(--red); margin-top:8px; min-height:14px;}
  .gate-switch{text-align:center; margin-top:16px; font-size:11.5px; color:var(--dim);}
  .gate-switch a{color:var(--green); text-decoration:none; cursor:pointer;}

  header{display:flex; justify-content:space-between; align-items:center; padding:14px 0 10px;}
  .brand{font-family:'Bebas Neue'; font-size:22px; letter-spacing:0.05em;}
  .brand span{color:var(--green);}
  .streak{font-size:12px; color:var(--gold); display:flex; align-items:center; gap:4px;}

  .payslip{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:20px 18px 18px; margin-bottom:14px;
    background-image: radial-gradient(circle, var(--bg) 2.5px, transparent 2.5px); background-size: 14px 14px; background-position: -7px 0;
    background-repeat: repeat-x; background-position-y: bottom;}
  .payslip-inner{background:var(--panel); padding-bottom:6px;}
  .payslip-top{display:flex; justify-content:space-between; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px dashed var(--line); padding-bottom:10px; margin-bottom:12px;}
  .payslip-title{font-family:'Bebas Neue'; font-size:13px; color:var(--dim); letter-spacing:0.08em;}
  .payslip-name{font-size:15px; font-weight:600; margin-bottom:2px;}
  .payslip-role{font-size:11.5px; color:var(--dim); margin-bottom:14px;}
  .salary-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .salary-label{font-size:11px; color:var(--dim); text-transform:uppercase;}
  .salary-value{font-family:'Bebas Neue'; font-size:38px; color:var(--green); line-height:1;}
  .breakdown{display:flex; gap:10px; margin-top:10px;}
  .chip-stat{flex:1; background:var(--panel2); border-radius:3px; padding:8px 10px; text-align:center;}
  .chip-stat .n{font-family:'Bebas Neue'; font-size:18px;}
  .chip-stat .l{font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.04em;}
  .stamp{position:absolute; top:16px; right:16px; border:2px solid var(--gold); color:var(--gold); border-radius:50%; width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-family:'Bebas Neue'; font-size:9.5px; line-height:1.05; transform:rotate(12deg); letter-spacing:0.02em; padding:4px;}

  .motivation{background:var(--panel2); border-left:3px solid var(--gold); border-radius:3px; padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:16px; color:#F2E7C9;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto;}
  .tab{padding:8px 14px; border-radius:20px; background:var(--panel); border:1px solid var(--line); color:var(--dim); font-size:12px; white-space:nowrap; cursor:pointer;}
  .tab.active{background:var(--green); color:#04160D; border-color:var(--green); font-weight:600;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:12px;}
  .section-title{font-family:'Bebas Neue'; font-size:18px; letter-spacing:0.03em; color:var(--gold); margin:0 0 10px;}
  .review-flag{display:inline-block; background:var(--blue); color:#04222E; font-size:9.5px; padding:3px 8px; border-radius:10px; font-weight:600; margin-bottom:10px; letter-spacing:0.03em;}

  .level-row{display:flex; gap:6px; margin-bottom:14px;}
  .lvl{flex:1; text-align:center; padding:9px 4px; border-radius:3px; background:var(--panel2); border:1px solid var(--line); font-size:11px; cursor:pointer; color:var(--dim);}
  .lvl.active{border-color:var(--green); color:var(--green);}
  .lvl small{display:block; font-size:9px; opacity:0.7;}

  .q-top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
  .eye-btn{background:var(--panel2); border:1px solid var(--line); color:var(--dim); border-radius:3px; padding:6px 10px; font-size:11px; cursor:pointer; white-space:nowrap;}
  .aula-box{background:rgba(217,169,59,0.08); border:1px solid rgba(217,169,59,0.35); border-radius:3px; padding:11px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px; color:#F2E7C9; display:none;}
  .aula-box.show{display:block;}
  .q-enunciado{font-size:14px; line-height:1.6; margin-bottom:12px;}
  .q-original{background:var(--panel2); border-radius:3px; padding:10px 12px; font-size:12.5px; color:var(--dim); margin-bottom:10px; font-style:italic;}
  .opt-list{display:flex; flex-direction:column; gap:8px;}
  .opt{text-align:left; padding:11px 13px; border-radius:3px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-family:inherit; font-size:13px; cursor:pointer;}
  .opt.correct{border-color:var(--green); background:rgba(53,208,127,0.12); color:var(--green);}
  .opt.wrong{border-color:var(--red); background:rgba(229,72,77,0.12); color:var(--red);}
  .feedback{margin-top:12px; padding:11px 12px; border-radius:3px; font-size:12.5px; line-height:1.5;}
  .feedback.ok{background:rgba(53,208,127,0.1); color:var(--green); border:1px solid rgba(53,208,127,0.3);}
  .feedback.bad{background:rgba(229,72,77,0.1); color:var(--red); border:1px solid rgba(229,72,77,0.3);}
  .mode-toggle{display:flex; gap:6px; margin:10px 0;}
  .mode-btn{flex:1; padding:7px; border-radius:3px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); font-size:11px; cursor:pointer; text-align:center;}
  .mode-btn.active{border-color:var(--gold); color:var(--gold);}
  .next-btn{margin-top:12px;}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .mcard{aspect-ratio:1; background:var(--panel2); border:1px solid var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:10.5px; padding:6px; cursor:pointer; line-height:1.3;}
  .mcard.flipped{background:var(--gold); color:#1a1400; border-color:var(--gold);}
  .mcard.matched{background:rgba(53,208,127,0.15); color:var(--green); border-color:var(--green); cursor:default;}
  .mcard.hidden-face{color:var(--dim); font-family:'Bebas Neue'; font-size:20px;}

  textarea{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:3px; font-family:inherit; font-size:12.5px; resize:vertical;}
  select{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:9px 10px; border-radius:3px; font-family:inherit; font-size:13px; margin-bottom:10px;}
  .qlist-item{border-bottom:1px solid var(--line); padding:10px 0; font-size:12px;}
  .qlist-item .meta{color:var(--dim); font-size:10.5px; margin-bottom:4px;}
  .row-btns{display:flex; gap:8px; margin-top:6px;}
  .row-btns button{flex:1; padding:6px; font-size:10.5px; border-radius:3px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); cursor:pointer;}

  .topic-bar{margin-bottom:10px;}
  .topic-bar .row{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;}
  .topic-bar .track{background:var(--panel2); border-radius:10px; height:8px; overflow:hidden;}
  .topic-bar .fill{background:var(--green); height:100%;}

  .footer-credit{text-align:center; color:var(--dim); font-size:10.5px; margin-top:24px; letter-spacing:0.03em;}
</style>
</head>
<body>

<div id="gate"><div class="gate-card" id="gateCard"></div></div>

<div id="app" style="display:none;">
  <div id="updateBanner"><span>Nova versão do app disponível.</span><button onclick="location.reload(true)">Atualizar agora</button></div>
  <header>
    <div class="brand">CONCURSO<span>://</span>ZERO</div>
    <div class="streak" id="streakDisplay">🔥 0 dias</div>
  </header>

  <div class="payslip">
    <div class="payslip-inner">
      <div class="stamp" id="stampBadge">LASCADO</div>
      <div class="payslip-top"><span class="payslip-title">Contracheque de Estudo</span><span id="payslipDate"></span></div>
      <div class="payslip-name" id="payslipName">Candidato(a)</div>
      <div class="payslip-role">Cargo pretendido: <span id="payslipRole">a definir</span></div>
      <div class="salary-row"><span class="salary-label">Salário acumulado</span></div>
      <div class="salary-value" id="salaryValue">R$ 0,00</div>
      <div class="breakdown">
        <div class="chip-stat"><div class="n" id="statQuestions">0</div><div class="l">questões</div></div>
        <div class="chip-stat"><div class="n" id="statAcertos">0%</div><div class="l">acerto</div></div>
        <div class="chip-stat"><div class="n" id="statEnergia">0</div><div class="l">energia</div></div>
      </div>
    </div>
  </div>

  <div class="motivation" id="motivationBox">Carregando...</div>
  <div class="tabs" id="tabBar"></div>
  <div id="tabContent"></div>
  <div class="footer-credit">Desenvolvido por Maiko Gomes de Almeida · <a href="#" onclick="logout(); return false;" style="color:var(--dim);">sair</a></div>
</div>

<script>
const APP_VERSION = "1.1.0";

/* ============ DADOS PADRÃO ============ */
const LEVEL_LABELS = [
  {min:0, max:999, title:"LASCADO"},
  {min:1000, max:2999, title:"MEIA BOCA"},
  {min:3000, max:6999, title:"MALANDRO"},
  {min:7000, max:14999, title:"VOCÊ É INTELIGENTE"},
  {min:15000, max:Infinity, title:"VOCÊ ZEROU A VIDA"}
];

const DEFAULT_PHRASES = {
  start: "Hoje você tá zerado, mas sabe de uma coisa? Zerado é diferente de parado. Você começou — isso já separa você de 90% dos cara que só falam que vão estudar um dia.",
  tiers: [
    {at:1518, msg:"Você bateu 1 salário mínimo simbólico. Mas olha na cara: isso não paga aluguel decente, não paga imprevisto. Bora pra 2."},
    {at:3036, msg:"2 salários já é outra pegada, mas ainda é sobrevivência. Você tá aqui pra sobreviver ou pra viver bem? Próxima meta: 3."},
    {at:4554, msg:"Com 3, já começa a sobrar pra guardar, pra respirar. Você já provou que consegue — a pergunta agora é até onde."},
    {at:10000, msg:"Isso aqui não é mais sobre estudar. É sobre virar outra pessoa. O você de 6 meses atrás nem imaginava chegar aqui."}
  ],
  daily: "Não tenha pressa, mas não perca tempo. Cada dia parado é como esquecer o que você já aprendeu.",
  streakBroken: "Sua sequência quebrou. Não é o fim — é só o momento de decidir se hoje é dia de voltar."
};

const DEFAULT_QUESTIONS = [
  {id:"q1", topico:"Reescritura de texto", nivel:0, tipo:"flash",
    aula:"Reescritura de texto é sobre pegar uma frase e reescrever de outro jeito (trocando ordem, trocando voz ativa/passiva, trocando conectivo) sem perder o sentido original. A banca troca uma palavrinha de propósito pra ver se você percebe a mudança de sentido.",
    enunciado:"Reescritura de texto avalia principalmente se duas frases mantêm o mesmo ___ ao mudar a estrutura.", resposta:"sentido", peso:0.2},
  {id:"q2", topico:"Reescritura de texto", nivel:0, tipo:"flash",
    aula:"Na voz ativa, o sujeito pratica a ação (Ex: 'O prefeito sancionou a lei'). Na voz passiva, o sujeito da ativa vira quem sofre a ação, chamado de agente da passiva (Ex: 'A lei foi sancionada pelo prefeito').",
    enunciado:"Ao trocar voz ativa por voz passiva, o sujeito da ativa vira o ___ da passiva.", resposta:"agente da passiva", peso:0.2},
  {id:"q3", topico:"Reescritura de texto", nivel:0, tipo:"flash",
    aula:"Você pode mudar completamente a estrutura de uma frase (ordem, voz, conectivo) desde que o sentido continue sendo exatamente o mesmo de antes. Se o sentido mudar, a reescritura tá errada, não importa o quão parecida pareça.",
    enunciado:"Numa reescritura correta, pode-se mudar a estrutura da frase, mas nunca o ___ original.", resposta:"sentido / significado", peso:0.2},
  {id:"q4", topico:"Reescritura de texto", nivel:1, tipo:"certo_errado",
    aula:"Trocar voz ativa por voz passiva mantendo os mesmos elementos (sujeito, verbo, complemento, tempo) preserva o sentido. É só uma reorganização gramatical, não uma mudança de significado.",
    original:"O prefeito sancionou a lei ontem.", enunciado:"A reescritura \"A lei foi sancionada pelo prefeito ontem\" preserva o sentido da frase original.", gabarito:true,
    justificativa_simples:"Correto: é apenas a transformação de voz ativa para voz passiva, sem perda de sentido.",
    justificativa_tdah:"Passo 1: identifica quem pratica a ação na frase original — é o prefeito. Passo 2: na reescritura, o prefeito continua sendo quem pratica a ação, só que agora aparece depois do verbo, introduzido por 'pelo'. Passo 3: o verbo 'sancionou' virou 'foi sancionada' — isso é só a forma passiva do mesmo verbo. Passo 4: nada do sentido mudou, só a ordem das palavras. Por isso está CERTO.", peso:0.5},
  {id:"q5", topico:"Reescritura de texto", nivel:1, tipo:"certo_errado",
    aula:"Mudar a ordem das informações numa frase não muda o sentido, desde que as relações entre elas (quem faz o quê, com que condição) continuem as mesmas.",
    original:"Todos os candidatos aprovados serão nomeados em até 60 dias.", enunciado:"A reescritura \"Em até 60 dias, serão nomeados todos os candidatos que forem aprovados\" mantém o mesmo sentido.", gabarito:true,
    justificativa_simples:"Correto: apenas a ordem das informações mudou, o sentido continua o mesmo.",
    justificativa_tdah:"Passo 1: pega os 3 pedaços de informação da frase original: (1) quem — candidatos aprovados, (2) o quê — serão nomeados, (3) quando — em até 60 dias. Passo 2: confere se esses 3 pedaços aparecem igual na reescritura, só em ordem diferente. Passo 3: sim, os 3 estão lá, intactos. Passo 4: como nenhuma condição ou informação sumiu ou mudou, o sentido é o mesmo. Por isso está CERTO.", peso:0.5},
  {id:"q6", topico:"Reescritura de texto", nivel:2, tipo:"certo_errado",
    aula:"Cuidado com palavras que limitam ('somente', 'apenas', 'só') e com condições ('caso', 'se', 'desde que'). Trocar 'somente' por 'sempre', ou remover uma condição, muda completamente o sentido da frase — mesmo que o resto pareça igual.",
    original:"Somente os aprovados no cadastro de reserva serão convocados, caso haja vacância.", enunciado:"A reescritura \"Os aprovados no cadastro de reserva serão sempre convocados, independentemente de haver vacância\" preserva o sentido original.", gabarito:false,
    justificativa_simples:"Errado: a frase original é condicional (só convoca se houver vaga). A reescritura removeu a condição e trocou \"somente\" por \"sempre\", mudando completamente o sentido.",
    justificativa_tdah:"Passo 1: lê a frase original com atenção nas palavras pequenas — 'somente' (limita) e 'caso haja' (é uma condição, um 'se'). Passo 2: a frase original diz: só convoca ESSE grupo, e só SE tiver vaga. Passo 3: agora olha a reescritura — ela trocou 'somente' por 'sempre' e trocou 'caso haja vacância' por 'independentemente de haver vacância'. Passo 4: isso inverteu o sentido: agora ela diz que sempre vai convocar, mesmo sem vaga. Passo 5: como a condição sumiu e a palavra de restrição virou o oposto, o sentido mudou. Por isso está ERRADO.", peso:0.5},
  {id:"q7", topico:"Reescritura de texto", nivel:2, tipo:"certo_errado",
    aula:"'Salvo se' e 'ainda que' parecem parecidos mas são opostos: 'salvo se X' significa 'exceto quando X acontecer' (é uma exceção que impede algo). 'Ainda que X' significa 'mesmo que X aconteça, o resto continua valendo' (é uma concessão que não impede nada).",
    original:"O servidor poderá ser exonerado a pedido, salvo se estiver respondendo a processo administrativo.", enunciado:"A reescritura \"O servidor poderá ser exonerado a pedido, ainda que esteja respondendo a processo administrativo\" preserva o sentido original.", gabarito:false,
    justificativa_simples:"Errado: \"salvo se\" indica exceção (não pode se estiver respondendo processo); \"ainda que\" indica concessão (pode mesmo respondendo processo). São sentidos opostos.",
    justificativa_tdah:"Passo 1: separa as duas expressões-chave: 'salvo se' (na original) e 'ainda que' (na reescritura). Passo 2: testa 'salvo se' numa frase simples — 'Vou à praia, salvo se chover' = se chover, EU NÃO VOU. É uma trava. Passo 3: agora testa 'ainda que' — 'Vou à praia, ainda que chova' = mesmo chovendo, EU VOU. É o oposto, não trava nada. Passo 4: aplicando isso na questão: a original trava a exoneração se tiver processo; a reescritura libera a exoneração mesmo com processo. Passo 5: são sentidos opostos, então a reescritura ERRA.", peso:0.5},
  {id:"q8", topico:"Reescritura de texto", nivel:3, tipo:"multipla",
    aula:"Em questões de reescritura por múltipla escolha, o método é: (1) identifica a ideia central da frase original, (2) elimina alternativas que invertem, removem ou adicionam informação, (3) fica só com quem diz exatamente a mesma coisa, com outras palavras.",
    enunciado:"Assinale a alternativa que reescreve a frase \"Não é a lei que garante direitos, mas sua aplicação correta que os efetiva\" sem alteração de sentido:",
    alternativas:[
      "A lei garante direitos, independentemente de sua aplicação.",
      "Os direitos são garantidos pela lei, e não pela sua aplicação correta.",
      "Quem efetiva os direitos é a aplicação correta da lei, não a lei em si.",
      "A aplicação da lei é irrelevante para a garantia de direitos.",
      "A lei e sua aplicação garantem direitos de forma equivalente."
    ],
    gabarito:2,
    justificativa_simples:"A original nega que a lei por si só garanta direitos, atribuindo esse papel à aplicação correta — exatamente o que a alternativa C reafirma.",
    justificativa_tdah:"Passo 1: quebra a frase original em duas partes ligadas por 'mas': parte 1 = 'não é a lei que garante direitos' (nega o papel da lei sozinha); parte 2 = 'é a aplicação correta que efetiva' (afirma o papel da aplicação). Passo 2: procura a alternativa que mantém as duas partes: nega a lei sozinha E afirma a aplicação. Passo 3: a alternativa A diz o oposto da parte 1 (afirma que a lei garante). Elimina. Passo 4: a B repete o erro da A. Elimina. Passo 5: a D e E dizem coisas que a frase original não disse. Eliminam. Passo 6: a C diz exatamente as duas partes: quem efetiva é a aplicação, não a lei em si. Ela é a resposta certa.", peso:1
  }
];

const DEFAULT_GAME_PAIRS = [
  {a:"Voz Passiva", b:"verbo ser/estar + particípio"},
  {a:"Sujeito", b:"quem pratica ou sofre a ação"},
  {a:"Agente da passiva", b:"quem pratica a ação na voz passiva"},
  {a:"Equivalência", b:"mesmo sentido, forma diferente"},
  {a:"Conectivo", b:"liga ideias e orações"},
  {a:"Ambiguidade", b:"erro que gera duplo sentido"}
];

const RESET_PHRASE = "QUERO ZERAR TUDO";

/* ============ ESTADO ============ */
let state = {
  admin: null,
  session: {isAdmin:false, entered:false},
  progress: {
    salary:0, totalQuestions:0, acertos:0, streak:0, lastDate:null, energia:0,
    answeredIds:[], correctIds:[], answersSinceReview:0, reviewThreshold: randInt(15,30),
    answersSinceUpdateCheck:0
  },
  questions: DEFAULT_QUESTIONS,
  phrases: DEFAULT_PHRASES,
  gamePairs: DEFAULT_GAME_PAIRS
};
let currentTab = "praticar";
let currentLevel = 0;
let currentQuestion = null;
let isReviewQuestion = false;
let gabaritoMode = "simples";
let answered = false;

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

/* ============ STORAGE (localStorage - funciona no app instalado) ============ */
async function saveKey(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ console.error("save fail", key, e); } }
async function loadKey(key){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
async function persistProgress(){ await saveKey('cz-progress', state.progress); }
async function persistQuestions(){ await saveKey('cz-questions', state.questions); }
async function persistPhrases(){ await saveKey('cz-phrases', state.phrases); }
async function persistAdmin(){ await saveKey('cz-admin', state.admin); }

/* ============ ATUALIZAÇÃO AUTOMÁTICA ============ */
async function checkForUpdate(){
  try{
    const res = await fetch('./version.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data.version && data.version !== APP_VERSION){
      document.getElementById('updateBanner').style.display = 'flex';
    }
  }catch(e){ /* offline ou version.json não existe ainda - ignora silenciosamente */ }
}

/* ============ INIT ============ */
async function init(){
  const [admin, progress, questions, phrases, session] = await Promise.all([
    loadKey('cz-admin'), loadKey('cz-progress'), loadKey('cz-questions'), loadKey('cz-phrases'), loadKey('cz-session')
  ]);
  if(admin) state.admin = admin;
  if(progress) state.progress = Object.assign(state.progress, progress);
  if(questions) state.questions = questions;
  if(phrases) state.phrases = phrases;
  if(!state.progress.answeredIds) state.progress.answeredIds = [];
  if(!state.progress.correctIds) state.progress.correctIds = [];
  if(!state.progress.reviewThreshold) state.progress.reviewThreshold = randInt(15,30);

  applyDailyDecay();
  checkForUpdate();

  if(session && session.entered && state.admin){
    state.session = session;
    enterApp();
  } else {
    renderGate();
  }
}

function logout(){ saveKey('cz-session', {isAdmin:false, entered:false}); location.reload(); }

function applyDailyDecay(){
  const today = new Date().toDateString();
  if(!state.progress.lastDate){ return; }
  if(state.progress.lastDate === today) return;
  const last = new Date(state.progress.lastDate);
  const diffDays = Math.round((new Date(today) - last) / 86400000);
  if(diffDays >= 2){
    state.progress.salary = Math.max(0, state.progress.salary - (diffDays - 1));
    state.progress.streak = 0;
  }
}

/* ============ GATE (login/setup) ============ */
function renderGate(){
  const card = document.getElementById('gateCard');
  if(!state.admin){
    card.innerHTML = `
      <h1>CONCURSO://ZERO</h1>
      <p class="sub">Primeiro acesso. Crie seu login de ADM — só quem tiver essa senha edita conteúdo, questões e frases do app.</p>
      <div class="field"><label>Nome</label><input id="setupName" placeholder="Maiko Gomes de Almeida"></div>
      <div class="field"><label>Usuário ADM</label><input id="setupUser" placeholder="ex: maiko"></div>
      <div class="field"><label>Senha ADM</label><input id="setupPass" type="password" placeholder="crie uma senha"></div>
      <button class="btn btn-primary" onclick="doSetup()">Criar acesso ADM</button>
      <div class="gate-msg" id="gateMsg"></div>
      <div class="gate-switch"><em>Obs: essa senha fica só neste dispositivo — pra um app publicado de verdade, precisa de autenticação real no backend.</em></div>
    `;
  } else {
    card.innerHTML = `
      <h1>CONCURSO://ZERO</h1>
      <p class="sub">Bem-vindo de volta. Entre como ADM pra editar conteúdo, ou entre como usuário pra só estudar.</p>
      <div class="field"><label>Usuário</label><input id="loginUser" placeholder="usuário ADM"></div>
      <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="senha"></div>
      <button class="btn btn-primary" onclick="doLogin(true)">Entrar como ADM</button>
      <button class="btn btn-ghost" onclick="doLogin(false)">Entrar só pra estudar</button>
      <div class="gate-msg" id="gateMsg"></div>
    `;
  }
}

function simpleHash(str){ return btoa(unescape(encodeURIComponent(str))); }

async function doSetup(){
  const name = document.getElementById('setupName').value.trim();
  const user = document.getElementById('setupUser').value.trim();
  const pass = document.getElementById('setupPass').value;
  if(!user || !pass){ document.getElementById('gateMsg').textContent = "Preenche usuário e senha."; return; }
  state.admin = {name: name || "Maiko Gomes de Almeida", username:user, passHash: simpleHash(pass)};
  await persistAdmin();
  state.session = {isAdmin:true, entered:true};
  await saveKey('cz-session', state.session);
  enterApp();
}

async function doLogin(asAdmin){
  if(!asAdmin){
    state.session = {isAdmin:false, entered:true};
    await saveKey('cz-session', state.session);
    enterApp();
    return;
  }
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(user === state.admin.username && simpleHash(pass) === state.admin.passHash){
    state.session = {isAdmin:true, entered:true};
    await saveKey('cz-session', state.session);
    enterApp();
  } else {
    document.getElementById('gateMsg').textContent = "Usuário ou senha errados.";
  }
}

function enterApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderTabs();
  renderShell();
  renderTab();
}

/* ============ SHELL ============ */
function currentTierTitle(){
  const total = state.progress.totalQuestions;
  const found = LEVEL_LABELS.find(l => total >= l.min && total <= l.max);
  return found ? found.title : "LASCADO";
}
function currentMotivation(){
  const s = state.progress.salary;
  if(s === 0) return state.phrases.start;
  let msg = state.phrases.daily;
  for(const t of state.phrases.tiers){ if(s >= t.at) msg = t.msg; }
  return msg;
}
function renderShell(){
  document.getElementById('payslipDate').textContent = new Date().toLocaleDateString('pt-BR');
  document.getElementById('payslipName').textContent = (state.admin && state.admin.name) || "Candidato(a)";
  document.getElementById('salaryValue').textContent = 'R$ ' + state.progress.salary.toFixed(2).replace('.', ',');
  document.getElementById('statQuestions').textContent = state.progress.totalQuestions;
  const pct = state.progress.totalQuestions > 0 ? Math.round((state.progress.acertos/state.progress.totalQuestions)*100) : 0;
  document.getElementById('statAcertos').textContent = pct + '%';
  document.getElementById('statEnergia').textContent = state.progress.energia;
  document.getElementById('stampBadge').textContent = currentTierTitle();
  document.getElementById('streakDisplay').textContent = '🔥 ' + state.progress.streak + ' dias';
  document.getElementById('motivationBox').textContent = currentMotivation();
}

/* ============ TABS ============ */
function renderTabs(){
  const bar = document.getElementById('tabBar');
  const tabs = [
    {id:'aula', label:'Aula'},
    {id:'praticar', label:'Praticar'},
    {id:'jogo', label:'Jogo'},
    {id:'indice', label:'Índice'},
    {id:'extrato', label:'Extrato'}
  ];
  if(state.session.isAdmin) tabs.push({id:'admin', label:'ADM'});
  bar.innerHTML = tabs.map(t => `<div class="tab ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</div>`).join('');
}
function switchTab(id){ currentTab = id; renderTabs(); renderTab(); }
function renderTab(){
  const el = document.getElementById('tabContent');
  if(currentTab === 'praticar') el.innerHTML = praticarHTML();
  else if(currentTab === 'aula') el.innerHTML = aulaHTML();
  else if(currentTab === 'jogo') el.innerHTML = jogoHTML();
  else if(currentTab === 'indice') el.innerHTML = indiceHTML();
  else if(currentTab === 'extrato') el.innerHTML = extratoHTML();
  else if(currentTab === 'admin') el.innerHTML = adminHTML();
  if(currentTab === 'jogo') initGame();
}

/* ============ AULA (área de leitura, separada da prática) ============ */
const LEVEL_META = [
  {n:0, label:"Nível 0", sub:"Aquecimento"},
  {n:1, label:"Nível 1", sub:"Literal"},
  {n:2, label:"Nível 2", sub:"Pegadinha"},
  {n:3, label:"Nível 3", sub:"Prova real"}
];

function getTopicos(){ return [...new Set(state.questions.map(q => q.topico || "Geral"))]; }

function aulaHTML(){
  const topicos = getTopicos();
  const aulas = state.questions.filter((q,i,arr) => arr.findIndex(x=>x.aula===q.aula) === i && q.aula);
  return `<div class="card">
    <div class="section-title">Área de estudo (leitura)</div>
    <p style="font-size:12px; color:var(--dim); margin-bottom:14px;">Aqui você lê o conteúdo com calma, sem pressão de responder. Quando sentir que entendeu, vai pra aba "Praticar" pra fixar com questões.</p>
    ${topicos.map(top => `
      <div style="margin-bottom:18px;">
        <div style="font-family:'Bebas Neue'; font-size:15px; color:var(--green); margin-bottom:8px; letter-spacing:0.02em;">${top}</div>
        ${state.questions.filter(q => (q.topico||"Geral")===top && q.aula).filter((q,i,arr)=>arr.findIndex(x=>x.aula===q.aula)===i).map(q => `
          <div class="aula-box show" style="margin-bottom:8px;">${q.aula}</div>
        `).join('')}

    `).join('')}

}

/* ============ PRATICAR (Kumon 4 níveis, sem repetir, com revisão aleatória) ============ */
function questionsForLevel(n){ return state.questions.filter(q => q.nivel === n); }

function pickNextQuestion(){
  const p = state.progress;
  // gatilho de revisão aleatória: intercala questão já acertada antes, de vez em quando
  if(p.correctIds.length > 3 && p.answersSinceReview >= p.reviewThreshold){
    const pool = p.correctIds.filter(id => state.questions.some(q=>q.id===id));
    const pickId = pool[randInt(0, pool.length-1)];
    const q = state.questions.find(x=>x.id===pickId);
    if(q){ isReviewQuestion = true; return q; }
  }
  isReviewQuestion = false;
  const all = questionsForLevel(currentLevel);
  const naoRespondidas = all.filter(q => !p.answeredIds.includes(q.id));
  const pool = naoRespondidas.length > 0 ? naoRespondidas : all;
  if(pool.length === 0) return null;
  return pool[randInt(0, pool.length-1)];
}

function praticarHTML(){
  if(!currentQuestion || answered === 'need-new'){ currentQuestion = pickNextQuestion(); }
  const q = currentQuestion;

  let levelRow = `<div class="level-row">` + LEVEL_META.map(l =>
    `<div class="lvl ${currentLevel===l.n?'active':''}" onclick="setLevel(${l.n})">${l.label}<small>${l.sub}</small></div>`
  ).join('') + `</div>`;

  const naoRespondidas = questionsForLevel(currentLevel).filter(qq => !state.progress.answeredIds.includes(qq.id));
  const avisoRevisao = naoRespondidas.length === 0 && questionsForLevel(currentLevel).length > 0
    ? `<p style="font-size:11px; color:var(--dim); margin-bottom:10px;">Você já respondeu todas as questões novas deste nível — agora tá revisando as que já fez.</p>` : '';

  if(!q) return `<div class="card"><div class="section-title">Praticar</div>${levelRow}<p style="color:var(--dim); font-size:13px;">Sem questões nesse nível ainda. Adicione pelo painel ADM.</p></div>`;

  let body = '';
  if(q.tipo === 'flash') body = flashHTML(q);
  else if(q.tipo === 'certo_errado') body = certoErradoHTML(q);
  else if(q.tipo === 'multipla') body = multiplaHTML(q);

  return `<div class="card">
    <div class="section-title">${q.topico || 'Praticar'}</div>
    ${levelRow}
    ${avisoRevisao}
    ${isReviewQuestion ? `<div class="review-flag">🔁 REVISÃO — questão de algo que você já mandou bem antes</div>` : ''}
    ${questionTopRow(q)}
    ${body}
  </div>`;
}

function questionTopRow(q){
  if(!q.aula) return '';
  return `<div class="q-top-row">
    <div></div>
    <button class="eye-btn" onclick="toggleAula()">👁 Ver aula</button>
  </div>
  <div class="aula-box" id="aulaBox">${q.aula}</div>`;
}
function toggleAula(){ document.getElementById('aulaBox').classList.toggle('show'); }

function setLevel(n){ currentLevel = n; answered = false; currentQuestion = null; renderTab(); }

function flashHTML(q){
  return `
    <div class="q-enunciado">${q.enunciado}</div>
    <input id="flashInput" placeholder="Digite a palavra que falta" style="width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:11px; border-radius:3px; font-family:inherit; margin-bottom:10px;">
    <button class="btn btn-primary" onclick="checkFlash('${q.id}')">Responder</button>
    <div id="fb"></div>
  `;
}
function checkFlash(id){
  if(answered === true) return;
  const q = state.questions.find(x=>x.id===id);
  const val = document.getElementById('flashInput').value.trim().toLowerCase();
  const correct = q.resposta.toLowerCase().split('/').some(opt => val.includes(opt.trim().split(' ')[0]));
  answered = true;
  registerAnswer(q, correct);
  renderFeedback(q, correct, `Resposta esperada: ${q.resposta}`, `Resposta esperada: ${q.resposta}. Dica: releia a aula (👁) se não lembrar o motivo.`);
}

function certoErradoHTML(q){
  return `
    <div class="q-original">"${q.original}"</div>
    <div class="q-enunciado">${q.enunciado}</div>
    <div class="opt-list">
      <button class="opt" onclick="checkCE('${q.id}', true, this)">CERTO</button>
      <button class="opt" onclick="checkCE('${q.id}', false, this)">ERRADO</button>
    </div>
    <div id="fb"></div>
  `;
}
function checkCE(id, chosen, btn){
  if(answered === true) return;
  const q = state.questions.find(x=>x.id===id);
  const correct = chosen === q.gabarito;
  answered = true;
  btn.classList.add(correct ? 'correct' : 'wrong');
  registerAnswer(q, correct);
  renderFeedback(q, correct, q.justificativa_simples, q.justificativa_tdah);
}

function multiplaHTML(q){
  return `
    <div class="q-enunciado">${q.enunciado}</div>
    <div class="opt-list">
      ${q.alternativas.map((alt,i)=>`<button class="opt" onclick="checkMulti('${q.id}', ${i}, this)">${String.fromCharCode(65+i)}) ${alt}</button>`).join('')}
    </div>
    <div id="fb"></div>
  `;
}
function checkMulti(id, chosenIdx, btn){
  if(answered === true) return;
  const q = state.questions.find(x=>x.id===id);
  const correct = chosenIdx === q.gabarito;
  answered = true;
  btn.classList.add(correct ? 'correct' : 'wrong');
  registerAnswer(q, correct);
  renderFeedback(q, correct, q.justificativa_simples, q.justificativa_tdah);
}

function renderFeedback(q, correct, textoSimples, textoTdah){
  gabaritoMode = "simples";
  window._fbTextos = {simples: textoSimples, tdah: textoTdah};
  document.getElementById('fb').innerHTML = feedbackHTML(correct);
}
function feedbackHTML(correct){
  const texto = gabaritoMode === 'simples' ? window._fbTextos.simples : window._fbTextos.tdah;
  return `<div class="feedback ${correct?'ok':'bad'}">
    ${correct?'✔ Acertou.':'✘ Errou.'}
    <div class="mode-toggle">
      <div class="mode-btn ${gabaritoMode==='simples'?'active':''}" onclick="setGabaritoMode('simples')">Modo simples</div>
      <div class="mode-btn ${gabaritoMode==='tdah'?'active':''}" onclick="setGabaritoMode('tdah')">Modo TDAH (passo a passo)</div>
    </div>
    ${texto}
    <div class="next-btn"><button class="btn btn-ghost" onclick="nextQuestion()">Próxima questão</button></div>
  </div>`;
}
function setGabaritoMode(mode){
  gabaritoMode = mode;
  const fb = document.getElementById('fb');
  const wasOk = fb.querySelector('.feedback').classList.contains('ok');
  fb.innerHTML = feedbackHTML(wasOk);
}

function nextQuestion(){
  answered = 'need-new';
  renderTab();
}

function registerAnswer(q, correct){
  const p = state.progress;
  const today = new Date().toDateString();
  if(p.lastDate !== today){
    p.streak += 1; p.lastDate = today; p.salary += 1;
  }
  p.totalQuestions += 1;
  if(!p.answeredIds.includes(q.id)) p.answeredIds.push(q.id);
  if(correct){
    p.acertos += 1; p.salary += q.peso;
    if(!p.correctIds.includes(q.id)) p.correctIds.push(q.id);
  } else {
    p.salary = Math.max(0, p.salary - q.peso);
    p.correctIds = p.correctIds.filter(id => id !== q.id);
  }
  if(p.totalQuestions % 100 === 0) p.salary += 10;

  if(isReviewQuestion){ p.answersSinceReview = 0; p.reviewThreshold = randInt(15,30); }
  else { p.answersSinceReview += 1; }

  p.answersSinceUpdateCheck = (p.answersSinceUpdateCheck||0) + 1;
  if(p.answersSinceUpdateCheck >= 10){ p.answersSinceUpdateCheck = 0; checkForUpdate(); }

  persistProgress();
  renderShell();
  renderTabs();
}

/* ============ ÍNDICE (progresso por tópico) ============ */
function indiceHTML(){
  const topicos = getTopicos();
  const rows = topicos.map(top => {
    const qs = state.questions.filter(q => (q.topico||"Geral") === top);
    const feitas = qs.filter(q => state.progress.answeredIds.includes(q.id)).length;
    const pct = qs.length > 0 ? Math.round((feitas/qs.length)*100) : 0;
    return `<div class="topic-bar">
      <div class="row"><span>${top}</span><span>${feitas}/${qs.length} · ${pct}%</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;"></div></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="section-title">Índice de progresso</div>
    ${rows || '<p style="color:var(--dim); font-size:12.5px;">Nenhum tópico cadastrado ainda.</p>'}
  </div>`;
}

/* ============ JOGO (memória) ============ */
let gameCards = []; let flippedIndices = []; let lockBoard = false;
function jogoHTML(){
  return `<div class="card">
    <div class="section-title">Jogo da Memória</div>
    <p style="font-size:12.5px; color:var(--dim); margin-bottom:12px;">Pareie o termo com a definição. Completar dá energia (não mexe no salário).</p>
    <div class="grid" id="memGrid"></div>
    <div id="gameMsg" style="margin-top:10px; font-size:12.5px; color:var(--green);"></div>
  </div>`;
}
function initGame(){
  const pairs = state.gamePairs;
  let deck = [];
  pairs.forEach((p, i) => { deck.push({key:i, text:p.a, type:'a'}); deck.push({key:i, text:p.b, type:'b'}); });
  deck.sort(() => Math.random() - 0.5);
  gameCards = deck.map(d => ({...d, flipped:false, matched:false}));
  flippedIndices = []; lockBoard = false;
  renderGrid();
}
function renderGrid(){
  const grid = document.getElementById('memGrid');
  if(!grid) return;
  grid.innerHTML = gameCards.map((c, i) => {
    const cls = c.matched ? 'matched' : (c.flipped ? 'flipped' : 'hidden-face');
    const label = (c.matched || c.flipped) ? c.text : '?';
    return `<div class="mcard ${cls}" onclick="flipCard(${i})">${label}</div>`;
  }).join('');
}
function flipCard(i){
  if(lockBoard || gameCards[i].flipped || gameCards[i].matched) return;
  gameCards[i].flipped = true;
  flippedIndices.push(i);
  renderGrid();
  if(flippedIndices.length === 2){
    lockBoard = true;
    const [a,b] = flippedIndices;
    if(gameCards[a].key === gameCards[b].key && gameCards[a].type !== gameCards[b].type){
      gameCards[a].matched = true; gameCards[b].matched = true;
      flippedIndices = []; lockBoard = false;
      renderGrid(); checkGameWin();
    } else {
      setTimeout(() => {
        gameCards[a].flipped = false; gameCards[b].flipped = false;
        flippedIndices = []; lockBoard = false;
        renderGrid();
      }, 800);
    }
  }
}
function checkGameWin(){
  if(gameCards.every(c => c.matched)){
    state.progress.energia += 5;
    persistProgress(); renderShell();
    document.getElementById('gameMsg').textContent = "Completou! +5 de energia. Bora de novo?";
  }
}

  <div class="card">
    <div class="section-title">Zona de risco</div>
    <p style="font-size:11.5px; color:var(--dim); margin-bottom:10px;">Pra zerar salário, questões e streak, digite exatamente: <strong style="color:var(--red);">${RESET_PHRASE}</strong></p>
    <button class="btn btn-danger" onclick="resetProgress()">Zerar progresso</button>
  </div>
  `;
}

function renderAdminFields(){
  const tipo = document.getElementById('admTipo').value;
  const el = document.getElementById('admFields');
  if(tipo === 'flash'){
    el.innerHTML = `
      <div class="field"><label>Enunciado (use ___ pro espaço)</label><textarea id="fEnunciado" rows="2"></textarea></div>
      <div class="field"><label>Resposta esperada</label><input id="fResposta"></div>
    `;
  } else if(tipo === 'certo_errado'){
    el.innerHTML = `
      <div class="field"><label>Frase original</label><textarea id="fOriginal" rows="2"></textarea></div>
      <div class="field"><label>Reescritura proposta (enunciado)</label><textarea id="fEnunciado" rows="2"></textarea></div>
      <div class="field"><label>Gabarito</label><select id="fGabarito"><option value="true">Certo</option><option value="false">Errado</option></select></div>
      <div class="field"><label>Justificativa — modo simples</label><textarea id="fJustSimples" rows="2"></textarea></div>
      <div class="field"><label>Justificativa — modo TDAH (passo a passo, linguagem fácil)</label><textarea id="fJustTdah" rows="4"></textarea></div>
    `;
  } else {
    el.innerHTML = `
      <div class="field"><label>Enunciado</label><textarea id="fEnunciado" rows="2"></textarea></div>
      <div class="field"><label>Alternativas (uma por linha, 5 linhas)</label><textarea id="fAlternativas" rows="5"></textarea></div>
      <div class="field"><label>Índice da correta (0=A, 1=B...)</label><input id="fGabaritoIdx" type="number" min="0" max="4"></div>
      <div class="field"><label>Justificativa — modo simples</label><textarea id="fJustSimples" rows="2"></textarea></div>
      <div class="field"><label>Justificativa — modo TDAH (passo a passo, linguagem fácil)</label><textarea id="fJustTdah" rows="4"></textarea></div>
    `;
  }
}

function addQuestion(){
  const nivel = parseInt(document.getElementById('admNivel').value);
  const tipo = document.getElementById('admTipo').value;
  const topico = document.getElementById('admTopico').value.trim() || "Geral";
  const aula = document.getElementById('admAula').value;
  const id = 'q' + Date.now();
  let q = {id, topico, aula, nivel, tipo, peso: nivel===0?0.2:(nivel===3?1:0.5)};
  if(tipo === 'flash'){
    q.enunciado = document.getElementById('fEnunciado').value;
    q.resposta = document.getElementById('fResposta').value;
  } else if(tipo === 'certo_errado'){
    q.original = document.getElementById('fOriginal').value;
    q.enunciado = document.getElementById('fEnunciado').value;
    q.gabarito = document.getElementById('fGabarito').value === 'true';
    q.justificativa_simples = document.getElementById('fJustSimples').value;
    q.justificativa_tdah = document.getElementById('fJustTdah').value;
  } else {
    q.enunciado = document.getElementById('fEnunciado').value;
    q.alternativas = document.getElementById('fAlternativas').value.split('\n').filter(x=>x.trim());
    q.gabarito = parseInt(document.getElementById('fGabaritoIdx').value);
    q.justificativa_simples = document.getElementById('fJustSimples').value;
    q.justificativa_tdah = document.getElementById('fJustTdah').value;
  }
  state.questions.push(q);
  persistQuestions();
  renderTab();
}

function deleteQuestion(id){
  state.questions = state.questions.filter(q => q.id !== id);
  persistQuestions();
  renderTab();
}

function savePhrases(){
  state.phrases.start = document.getElementById('admPhraseStart').value;
  state.phrases.daily = document.getElementById('admPhraseDaily').value;
  persistPhrases(); renderShell();
  alert('Frases salvas.');
}

function resetProgress(){
  const digitado = prompt(`Isso zera salário, questões e streak. Pra confirmar, digite exatamente:\n\n${RESET_PHRASE}`);
  if(digitado !== RESET_PHRASE){ alert('Frase não confere. Nada foi zerado.'); return; }
  state.progress = {salary:0, totalQuestions:0, acertos:0, streak:0, lastDate:null, energia:0, answeredIds:[], correctIds:[], answersSinceReview:0, reviewThreshold: randInt(15,30), answersSinceUpdateCheck:0};
  persistProgress(); renderShell(); renderTab();
}

/* boot */
document.addEventListener('DOMContentLoaded', () => { renderAdminFields(); });
init();
window.setLevel = setLevel;
window.switchTab = switchTab;
window.checkFlash = checkFlash;
window.checkCE = checkCE;
window.checkMulti = checkMulti;
window.nextQuestion = nextQuestion;
window.flipCard = flipCard;
window.deleteQuestion = deleteQuestion;
window.addQuestion = addQuestion;
window.savePhrases = savePhrases;
window.resetProgress = resetProgress;
window.renderAdminFields = renderAdminFields;
window.doSetup = doSetup;
window.doLogin = doLogin;
window.logout = logout;
window.toggleAula = toggleAula;
window.setGabaritoMode = setGabaritoMode;
</script>
</body>
</html>
